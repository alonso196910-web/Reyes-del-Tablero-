<style>
  :root{
    --bg:#050505; --panel:#111; --line:#2a2412;
    --gold:#d4af37; --gold-soft:#e7cf7a; --cream:#f4efe1; --muted:#a59a78;
    --sq-light:#ecdcae; --sq-dark:#a37f2c;
    --bs:min(94vw, 540px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--cream);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:14px 3vw calc(20px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:12px;width:var(--bs);margin-bottom:12px}
  header img{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);flex:none}
  header h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,5.4vw,28px);margin:0;color:var(--gold);letter-spacing:.5px;line-height:1.1}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .bar{width:var(--bs);display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:14px}
  .bar b{color:var(--gold-soft);font-weight:600}
  #status{min-height:20px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:7px;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  #boardWrap{position:relative;width:var(--bs);height:var(--bs);border:3px solid var(--gold);border-radius:6px;
    box-shadow:0 0 0 1px #000,0 10px 30px rgba(212,175,55,.12)}
  #board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;
    touch-action:none;user-select:none;-webkit-user-select:none}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
  .sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,226,90,.45)}
  .sq.sel::before{content:"";position:absolute;inset:0;background:rgba(80,200,120,.55)}
  .sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(230,30,30,.9) 0%,rgba(230,30,30,0) 75%)}
  .sq .hint{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,20,20,.28)}
  .sq .ring{position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(20,20,20,.3)}
  .sq .co{position:absolute;font-size:clamp(8px,2.2vw,11px);font-weight:700;opacity:.8;pointer-events:none}
  .sq.l .co{color:var(--sq-dark)} .sq.d .co{color:var(--sq-light)}
  .co.rk{top:2px;left:3px} .co.fl{bottom:1px;right:3px}
  .pc{position:relative;font-size:calc(var(--bs) / 8 * .8);line-height:1;pointer-events:none;
    font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",serif}
  .pc.w{color:#fff;text-shadow:0 0 1px #000,0 0 2px #000,1px 1px 1px #000,-1px -1px 1px #000,1px -1px 1px #000,-1px 1px 1px #000}
  .pc.b{color:#101010;text-shadow:0 0 2px rgba(255,255,255,.55)}
  #ghost{position:fixed;z-index:50;pointer-events:none;display:none;transform:translate(-50%,-55%)}
  .controls{width:var(--bs);display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .controls label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  select,button{font:inherit;color:var(--cream);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
  select{width:100%}
  button{cursor:pointer;font-weight:600}
  button.main{background:var(--gold);color:#111;border-color:var(--gold)}
  button:disabled{opacity:.4;cursor:default}
  button:not(:disabled):active{transform:scale(.98)}
  .btns{width:var(--bs);display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:8px}
  #moves{width:var(--bs);margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;max-height:130px;overflow:auto;font-size:14px;line-height:1.7;color:var(--cream)}
  #moves h2{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  #moves span.n{color:var(--muted);margin-left:8px} #moves span.n:first-of-type{margin-left:0}
  #moves .empty{color:var(--muted)}
  footer{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
  footer b{color:var(--gold)}
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .card{width:min(92vw,360px);background:#0b0b0b;border:2px solid var(--gold);border-radius:16px;padding:20px;text-align:center}
  .card img{width:150px;height:150px;border-radius:12px}
  .card h3{margin:12px 0 4px;font-family:Georgia,serif;font-size:24px;color:var(--gold)}
  .card p{margin:0 0 16px;color:var(--cream)}
  .promo{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .promo button{font-size:44px;line-height:1;padding:6px 12px;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;background:var(--sq-light)}
  .promo button.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}
  .promo button.b{color:#101010}
</style>
</head>

<script>
/* ---------- Carga de librerías con respaldo ---------- */
function loadScript(urls, done){
  var i = 0;
  (function next(){
    if(i >= urls.length){ done(false); return; }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function(){ done(true); };
    s.onerror = function(){ s.remove(); next(); };
    document.head.appendChild(s);
  })();
}
var CHESS_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js',
  'https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js'
];
var SF_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js',
  'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js'
];

/* ---------- Niveles ---------- */
var LEVELS = [
  {skill:0,  go:'go depth 1',        depth:1, noise:90},
  {skill:4,  go:'go movetime 150',   depth:2, noise:35},
  {skill:9,  go:'go movetime 350',   depth:2, noise:10},
  {skill:15, go:'go movetime 700',   depth:3, noise:0},
  {skill:20, go:'go movetime 1500',  depth:3, noise:0}
];

/* ---------- Estado ---------- */
var game, player = 'w', flipped = false, selected = null, targets = [], thinking = false, token = 0, over = false;
var GL = {k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function glyph(t){ return GL[t] + '︎'; }

var $ = function(id){ return document.getElementById(id); };
var boardEl = $('board');

/* ---------- Motor: Stockfish (worker) con respaldo propio ---------- */
var Engine = {
  worker:null, kind:'none', skip:0, cb:null, busy:false,
  tryWorker:function(url){
    return new Promise(function(res){
      var w, t;
      try{
        var blob = new Blob(["importScripts('" + url + "');"], {type:'application/javascript'});
        w = new Worker(URL.createObjectURL(blob));
      }catch(e){ return res(null); }
      t = setTimeout(function(){ try{w.terminate();}catch(e){} res(null); }, 12000);
      w.onerror = function(){ clearTimeout(t); try{w.terminate();}catch(e){} res(null); };
      w.onmessage = function(e){
        if(String(e.data).indexOf('uciok') >= 0){ clearTimeout(t); w.onmessage = null; w.onerror = null; res(w); }
      };
      w.postMessage('uci');
    });
  },
  init:async function(){
    for(var i = 0; i < SF_URLS.length; i++){
      var w = await this.tryWorker(SF_URLS[i]);
      if(w){
        this.worker = w; this.kind = 'stockfish';
        var self = this;
        w.onmessage = function(e){
          var s = String(e.data);
          if(s.indexOf('bestmove') === 0){
            if(self.skip > 0){ self.skip--; return; }
            self.busy = false;
            var mv = s.split(' ')[1], cb = self.cb; self.cb = null;
            if(cb) cb(mv);
          }
        };
        w.postMessage('isready');
        return;
      }
    }
    this.kind = 'basic';
  },
  think:function(fen, lvl, cb){
    var self = this;
    if(this.kind === 'stockfish'){
      this.busy = true; this.cb = cb;
      this.worker.postMessage('setoption name Skill Level value ' + lvl.skill);
      this.worker.postMessage('position fen ' + fen);
      this.worker.postMessage(lvl.go);
    }else{
      setTimeout(function(){ cb(basicMove(fen, lvl)); }, 30);
    }
  },
  cancel:function(){
    if(this.kind === 'stockfish' && this.busy){ this.skip++; this.busy = false; this.cb = null; this.worker.postMessage('stop'); }
  }
};

/* Motor básico de respaldo (solo si no carga Stockfish) */
var VAL = {p:100,n:320,b:330,r:500,q:900,k:0};
function evalBoard(g){
  var b = g.board(), s = 0;
  for(var r = 0; r < 8; r++) for(var c = 0; c < 8; c++){
    var p = b[r][c]; if(!p) continue;
    var cen = 12 - (Math.abs(3.5 - c) + Math.abs(3.5 - r)) * 3;
    var v = VAL[p.type] + (p.type === 'p' ? (p.color === 'w' ? (7 - r) : r) * 6 : cen);
    s += p.color === 'w' ? v : -v;
  }
  return s;
}
function negamax(g, d, a, b, col){
  if(d === 0 || g.game_over()){
    if(g.in_checkmate()) return -99999 - d;
    if(g.game_over()) return 0;
    return col * evalBoard(g);
  }
  var ms = g.moves(), best = -Infinity;
  for(var i = 0; i < ms.length; i++){
    g.move(ms[i]); var v = -negamax(g, d - 1, -b, -a, -col); g.undo();
    if(v > best) best = v; if(v > a) a = v; if(a >= b) break;
  }
  return best;
}
function basicMove(fen, lvl){
  var g = new Chess(fen), col = g.turn() === 'w' ? 1 : -1, ms = g.moves({verbose:true}), best = null, bv = -Infinity;
  ms.sort(function(){ return Math.random() - .5; });
  for(var i = 0; i < ms.length; i++){
    var m = ms[i]; g.move(m);
    var v = -negamax(g, lvl.depth - 1, -Infinity, Infinity, -col) + (Math.random() - .5) * lvl.noise * 4;
    g.undo();
    if(v > bv){ bv = v; best = m; }
  }
  return best.from + best.to + (best.promotion || '');
}

/* ---------- Dibujo del tablero ---------- */
function kingSquare(color){
  var b = game.board();
  for(var r = 0; r < 8; r++) for(var c = 0; c < 8; c++){
    var p = b[r][c]; if(p && p.type === 'k' && p.color === color) return 'abcdefgh'[c] + (8 - r);
  }
}
function render(){
  var last = game.history({verbose:true}); last = last.length ? last[last.length - 1] : null;
  var chkSq = game.in_check() ? kingSquare(game.turn()) : null;
  var html = '';
  for(var i = 0; i < 64; i++){
    var r = Math.floor(i / 8), c = i % 8;
    var rr = flipped ? 7 - r : r, cc = flipped ? 7 - c : c;
    var sq = 'abcdefgh'[cc] + (8 - rr);
    var p = game.get(sq);
    var cls = 'sq ' + ((rr + cc) % 2 === 0 ? 'l' : 'd');
    if(last && (last.from === sq || last.to === sq)) cls += ' last';
    if(selected === sq) cls += ' sel';
    if(chkSq === sq) cls += ' chk';
    html += '<div class="' + cls + '" data-sq="' + sq + '">';
    if(c === 0) html += '<span class="co rk">' + (8 - rr) + '</span>';
    if(r === 7) html += '<span class="co fl">' + 'abcdefgh'[cc] + '</span>';
    var tg = targets.filter(function(m){ return m.to === sq; })[0];
    if(tg) html += p ? '<span class="ring"></span>' : '<span class="hint"></span>';
    if(p) html += '<span class="pc ' + p.color + '" data-pc="1">' + glyph(p.type) + '</span>';
    html += '</div>';
  }
  boardEl.innerHTML = html;
  renderMoves();
}
function renderMoves(){
  var h = game.history(), out = '';
  if(!h.length){ $('movesList').innerHTML = '<span class="empty">Aún no hay jugadas.</span>'; return; }
  for(var i = 0; i < h.length; i += 2){
    out += '<span class="n">' + (i / 2 + 1) + '.</span> ' + h[i] + (h[i + 1] ? ' ' + h[i + 1] : '') + ' ';
  }
  var m = $('moves'); $('movesList').innerHTML = out; m.scrollTop = m.scrollHeight;
}
function setStatus(html){ $('status').innerHTML = html; }

/* ---------- Flujo de la partida ---------- */
function lvl(){ return LEVELS[+$('level').value]; }

function afterMove(){
  selected = null; targets = [];
  render();
  updateButtons();
  if(game.game_over()){ endGame(); return; }
  if(game.turn() !== player) engineTurn();
  else setStatus(game.in_check() ? '<b>¡Jaque!</b> Tu turno' : 'Tu turno');
}
function engineTurn(){
  thinking = true; updateButtons();
  setStatus('<span class="dot"></span>Stockfish está pensando…');
  var tk = ++token, t0 = Date.now();
  Engine.think(game.fen(), lvl(), function(mv){
    if(tk !== token) return;
    var wait = Math.max(0, 400 - (Date.now() - t0));
    setTimeout(function(){
      if(tk !== token) return;
      thinking = false;
      game.move({from:mv.slice(0,2), to:mv.slice(2,4), promotion:mv[4] || undefined});
      afterMove();
    }, wait);
  });
}
function endGame(){
  over = true; updateButtons();
  var t, x;
  if(game.in_checkmate()){
    var loser = game.turn();
    if(loser === player){ t = 'Ganó Stockfish'; x = 'Jaque mate. Revisa la partida y vuelve a intentarlo.'; }
    else { t = '¡Ganaste!'; x = 'Jaque mate. ¡Excelente partida, Rey del Tablero!'; }
  }else if(game.in_stalemate()){ t = 'Tablas'; x = 'Rey ahogado.'; }
  else if(game.in_threefold_repetition()){ t = 'Tablas'; x = 'Triple repetición de posición.'; }
  else if(game.insufficient_material()){ t = 'Tablas'; x = 'Material insuficiente para dar mate.'; }
  else { t = 'Tablas'; x = 'Regla de los 50 movimientos.'; }
  setStatus('<b>' + t + '</b>');
  $('endTitle').textContent = t; $('endText').textContent = x;
  setTimeout(function(){ $('endOverlay').classList.add('show'); }, 600);
}
function newGame(){
  token++; Engine.cancel(); thinking = false; over = false;
  game = new Chess();
  var s = $('side').value; player = s === 'r' ? (Math.random() < .5 ? 'w' : 'b') : s;
  flipped = player === 'b'; selected = null; targets = [];
  $('endOverlay').classList.remove('show');
  render(); updateButtons();
  if(player === 'b') engineTurn(); else setStatus('Tu turno · juegas con blancas');
}
function updateButtons(){
  $('undoBtn').disabled = thinking || over || game.history().length < 2 && !(game.history().length === 1 && player === 'w');
}
function undo(){
  if(thinking) return;
  var n = game.history().length;
  if(n === 0) return;
  over = false; $('endOverlay').classList.remove('show');
  if(game.turn() === player){ game.undo(); if(game.history().length && game.turn() !== player) game.undo(); }
  else game.undo();
  if(game.history().length === 0 && player === 'b'){ afterMove(); return; }
  selected = null; targets = []; render(); updateButtons(); setStatus('Tu turno');
}

/* ---------- Entrada del jugador (clic y arrastrar) ---------- */
function canPlay(){ return game && !thinking && !over && game.turn() === player; }
function squareAt(x, y){
  var el = document.elementFromPoint(x, y);
  while(el && el !== document.body){ if(el.dataset && el.dataset.sq) return el.dataset.sq; el = el.parentNode; }
  return null;
}
function select(sq){
  selected = sq;
  targets = sq ? game.moves({square:sq, verbose:true}) : [];
  render();
}
function tryMove(from, to){
  var cand = game.moves({square:from, verbose:true}).filter(function(m){ return m.to === to; });
  if(!cand.length) return false;
  if(cand[0].flags.indexOf('p') >= 0){
    askPromotion(function(pc){ game.move({from:from, to:to, promotion:pc}); afterMove(); });
    return true;
  }
  game.move({from:from, to:to}); afterMove();
  return true;
}
function askPromotion(cb){
  var box = $('promoBtns'); box.innerHTML = '';
  ['q','r','b','n'].forEach(function(t){
    var b = document.createElement('button');
    b.className = player; b.textContent = glyph(t);
    b.onclick = function(){ $('promoOverlay').classList.remove('show'); cb(t); };
    box.appendChild(b);
  });
  $('promoOverlay').classList.add('show');
}

var drag = null;
boardEl.addEventListener('pointerdown', function(e){
  if(!canPlay()) return;
  var sq = squareAt(e.clientX, e.clientY); if(!sq) return;
  var p = game.get(sq);
  if(selected && selected !== sq && targets.some(function(m){ return m.to === sq; })){
    tryMove(selected, sq); e.preventDefault(); return;
  }
  if(p && p.color === player){
    select(sq);
    var g = $('ghost'); g.className = 'pc ' + p.color; g.textContent = glyph(p.type);
    drag = {from:sq, moved:false, sx:e.clientX, sy:e.clientY};
    e.preventDefault();
  }else if(selected){ select(null); }
});
window.addEventListener('pointermove', function(e){
  if(!drag) return;
  if(!drag.moved && Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6){
    drag.moved = true; $('ghost').style.display = 'block';
    var el = boardEl.querySelector('[data-sq="' + drag.from + '"] .pc'); if(el) el.style.opacity = .25;
  }
  if(drag.moved){ var g = $('ghost'); g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }
});
window.addEventListener('pointerup', function(e){
  if(!drag) return;
  var d = drag; drag = null; $('ghost').style.display = 'none';
  if(d.moved){
    var to = squareAt(e.clientX, e.clientY);
    if(to && to !== d.from && tryMove(d.from, to)) return;
    render(); // soltó en un lugar inválido: regresar la pieza
  }
});
window.addEventListener('pointercancel', function(){ if(drag){ drag = null; $('ghost').style.display = 'none'; render(); } });

/* ---------- Botones ---------- */
$('newBtn').onclick = newGame;
$('againBtn').onclick = newGame;
$('closeBtn').onclick = function(){ $('endOverlay').classList.remove('show'); };
$('undoBtn').onclick = undo;
$('flipBtn').onclick = function(){ flipped = !flipped; render(); };
$('side').onchange = newGame;

/* ---------- Arranque ---------- */
loadScript(CHESS_URLS, function(ok){
  if(!ok || typeof Chess === 'undefined'){
    setStatus('No se pudo cargar el tablero. Revisa tu conexión y recarga la página.');
    return;
  }
  game = new Chess();
  render();
  Engine.init().then(function(){
    $('engineTag').textContent = Engine.kind === 'stockfish' ? 'Stockfish listo' : 'Motor básico';
    newGame();
    if(Engine.kind !== 'stockfish') setStatus('Tu turno · (Stockfish no cargó, usando motor básico)');
  });
});
</script>
